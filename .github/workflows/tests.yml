name: Tests

on:
  push:
    branches: [ main, "codex/**" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'paper/**'
      - 'docs/**'
      - 'README.md'
      - 'TODO.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'paper/**'
      - 'docs/**'
      - 'README.md'
      - 'TODO.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  # Allow manual triggering
  workflow_dispatch:
  # Scheduled runs for regression testing
  schedule:
    - cron: '0 0 * * 0'  # Run at 00:00 on Sunday

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: [ '3.11', '3.15' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Prepare reviewed readability test data
        run: python .github/scripts/prepare_test_data.py "${{ runner.temp }}/nltk_data"

      - name: Install real Pandoc on Linux 3.11
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pandoc=3.1.3+ds-2
          pandoc --version

      - name: Require native Pandoc metadata integration
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        run: |
          python -c "import shutil; assert shutil.which('pandoc'), 'Pandoc is required in this job'"
          python -m pytest --benchmark-disable -v tests/test_pandoc_metadata_real.py

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      
      - name: Check types with mypy
        run: |
          mypy src --ignore-missing-imports
      
      - name: Run tests with coverage
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        run: |
          python -m pytest --benchmark-disable --cov=src --cov-report=xml --cov-report=term tests/
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
      
      - name: Run performance benchmarks
        env:
          NLTK_DATA: ${{ runner.temp }}/nltk_data
        run: |
          python -m pytest tests/ --benchmark-only --benchmark-save=benchmark
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: .benchmarks/

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit==1.9.4 pip-audit
      
      - name: Run security scan with bandit
        run: |
          bandit -r src -c pyproject.toml
      
      - name: Check for vulnerable dependencies
        # Advisory only: the vulnerability database changes independently of this repo.
        continue-on-error: true
        run: |
          pip-audit --skip-editable
