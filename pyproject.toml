[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-decision-process"
version = "0.3.0"
description = "A framework reimagining Markdown documents as Markov Decision Processes"
readme = "README.md"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["markdown", "markov", "decision-process", "nlp", "text-generation"]
dependencies = [
    "numpy>=1.20.0",
    "markdown>=3.3.0",
    "networkx>=2.6.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-benchmark>=3.4",
    "hypothesis>=6.0",
    "textstat>=0.7",
    "wordcloud>=1.8",
    "black>=21.5b2",
    "isort>=5.9.0",
    "mypy>=0.812",
    "flake8>=3.9.0",
]

[project.urls]
"Homepage" = "https://github.com/docxology/markdown_decision_process"
"Bug Tracker" = "https://github.com/docxology/markdown_decision_process/issues"
"Documentation" = "https://markdown-decision-process.readthedocs.io"
"Paper" = "https://doi.org/10.5281/zenodo.17244387"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88 