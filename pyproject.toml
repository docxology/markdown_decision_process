[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-decision-process"
version = "0.3.0"
description = "A framework reimagining Markdown documents as Markov Decision Processes"
readme = "README.md"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["markdown", "markov", "decision-process", "nlp", "text-generation"]
dependencies = [
    "numpy>=1.20.0",
    "markdown>=3.3.0",
    "networkx>=2.6.0",
    "scipy>=1.10.0",  # networkx>=3 PageRank (StateSpace.calculate_pagerank) needs scipy
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.90",
    "pandas>=2.0",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "textstat>=0.7.3",
    "wordcloud>=1.9.2",
    "black>=24.1.0",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "flake8>=5.0.4",  # flake8 6+ requires Python>=3.8.1, which breaks ">=3.8" resolution
]

[project.urls]
"Homepage" = "https://github.com/docxology/markdown_decision_process"
"Bug Tracker" = "https://github.com/docxology/markdown_decision_process/issues"
"Documentation" = "https://github.com/docxology/markdown_decision_process/tree/main/docs"
"Paper" = "https://doi.org/10.5281/zenodo.17244387"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.bandit]
# The CI security job runs: bandit -r src -c pyproject.toml
exclude_dirs = ["tests", "examples", "docs", "paper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88 