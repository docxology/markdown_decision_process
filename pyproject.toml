[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-decision-process"
version = "0.1.0"
description = "A framework reimagining Markdown documents as Markov Decision Processes"
readme = "README.md"
authors = [
    {name = "MDP Contributors", email = "info@example.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["markdown", "markov", "decision-process", "nlp", "text-generation"]
dependencies = [
    "numpy>=1.20.0",
    "markdown>=3.3.0",
    "networkx>=2.6.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.5b2",
    "isort>=5.9.0",
    "mypy>=0.812",
    "flake8>=3.9.0",
]

[project.urls]
"Homepage" = "https://github.com/username/markdown-decision-process"
"Bug Tracker" = "https://github.com/username/markdown-decision-process/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88 